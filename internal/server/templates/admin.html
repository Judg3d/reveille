<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reveille Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Reveille</p>
        <h1>Managed targets</h1>
      </div>
      <div id="refresh-state" class="pill">Loading…</div>
    </header>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Host</th>
            <th>Target</th>
            <th>State</th>
            <th>Timer</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="hosts"></tbody>
      </table>
    </div>
    <p id="error" class="error hidden"></p>
  </main>
  <script id="reveille-admin-config" type="application/json">{{.ConfigJSON}}</script>
  <script src="/static/admin.js"></script>
</body>
</html>
